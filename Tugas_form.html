<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <form>
        <h1>Data Diri Siswa</h1>
        <label>Nama Lengkap:</label>
        <input type="text">
        <br><br>

        <label>Nomer Induk Asal:</label>
        <input type="number">
        <br><br>
        
        <label>NISN:</label>
        <input type="number">
        <br><br>

        <label>Tempat & Tanggal Lahir:</label>
        <input type="date">
        <br><br>

        <label>Jenis-Kelamin</label>
        <input type="radio" name="gender" value="L">Laki-laki
        <input type="radio" name="gender" value="P">Perempuan

        <label>Agama</label>
        <input type="text">
        <br><br>

        <label>Anak Ke:</label>
        <input type="number">
        <br><br>

        <label>Status Anak Dalam Keluarga:</label>
        <input type="radio" name="gender" >Anak Kandung
        <input type="radio" name="gender" >Anak Angkat
        <input type="radio" name="gender" >Lainnya
        <br><br>

         <label>Alamat Siswa</label>
        <input type="text">
        <br><br>

         <label>Nomer Telpon Siswa</label>
        <input type="tel">
        <br><br>

         <label>Sekolah Asal</label>
        <input type="text">
        <br><br>
        <hr>

        <h1>Data Orang Tua Kandung</h1>
        <label>Nama Lengkap Ayah:</label>
        <input type="text">
        <br><br>

        <label>Nama Lengkap Ibu:</label>
        <input type="text">
        <br><br>

        <label>Alamat:</label>
        <input type="text">
        <br><br>

        <label>No. Telepon:</label>
        <input type="tel">
        <br><br>

        <label>Pekerjaan Ayah:</label>
        <input type="text">
        <label>Pekerjaan Ibu:</label>
        <input type="text">
        <br><br>

        <label>Pendidikan Terakhir Ayah:</label>
        <input type="text">
        <label>Pendidikan Terakhir Ibu:</label>
        <input type="text">

    </form>
</body>
</html>
